[workspace]
resolver = "3"
members = ["lib/engine", "services/cli", "services/mcp"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
engine = { path = "./lib/engine" }

config = { version = "0.15.27", default-features = false, features = ["yaml"] }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
secrecy = { version = "0.10.3" }
tokio = { version = "1.54.1", default-features = false, features = [
  "macros",
  "rt-multi-thread",
] }
yaml_serde = { version = "0.10.7" }
thiserror = { version = "2.0.21" }

[workspace.lints.clippy]
large_enum_variant = "deny"
perf = { level = "warn", priority = 1 }
redundant_clone = "deny"
trivially_copy_pass_by_ref = "warn"
large_types_passed_by_value = "warn"
clone_on_ref_ptr = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
str_to_string = "warn"
needless_collect = "warn"
large_futures = "warn"
missing_safety_doc = "deny"
panic = "deny"
todo = "warn"
unwrap_used = "deny"

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
unsafe_code = "deny"

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"
lto = false

[profile.release]
opt-level = 3
strip = true
lto = "fat"
panic = "abort"
codegen-units = 1
